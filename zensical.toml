# 3) LOOK AND FEEL ---------------------------------------------------
[project.theme]
language = "en"
# logo    = "assets/logo.png"      # remove the # and add a logo file to use one
# favicon = "assets/logo.png"
features = [
  "announce.dismiss",
  "content.action.edit",       # pencil button on each page for staff
  "content.code.copy",         # copy button on commands
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",         # Previous / Next buttons
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",           # breadcrumb trail
  "navigation.sections",
  "navigation.tabs",           # top-level sections as tabs on desktop
  "navigation.top",            # "back to top" button
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# Colours: try "indigo", "deep purple", "teal", "red", "blue grey" ...
# Dark mode is first so it opens dark, like Discord.
[[project.theme.palette]]
scheme  = "slate"
primary = "indigo"
accent  = "amber"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme  = "default"
primary = "indigo"
accent  = "amber"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# Link to your Discord in the footer — change the invite link
[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/YOUR-INVITE"
name = "Join us on Discord"

# 4) WRITING FEATURES (no need to touch) -----------------------------
[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
