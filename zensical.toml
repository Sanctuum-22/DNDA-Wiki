# =====================================================================
#  SITE SETTINGS  —  the only file you need to edit to change the
#  site name, colours, and menu.  Lines starting with # are notes.
# =====================================================================

[project]

# 1) CHANGE THESE THREE LINES ---------------------------------------
site_name = "DNDAnonymous Wiki"
site_url  = "https://YOUR-USERNAME.github.io/YOUR-REPO/"
repo_url  = "https://github.com/YOUR-USERNAME/YOUR-REPO"
# -------------------------------------------------------------------

site_description = "Rules, guides and lore for the DNDAnonymous Discord server and the world of Eres."
repo_name = "Edit this wiki"
edit_uri  = "edit/main/docs/"
copyright = "Made by the DNDAnonymous staff team"

